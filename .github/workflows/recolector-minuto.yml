# Lee bizkaia.eus cada minuto y recalcula la predicción cada 15 min, sin interrupción: cada hora arranca un tramo de 57 min que captura
# cada 60 s y sube los datos cada 2 min (y prediccion/directo.json para el panel). (Repositorio público = minutos de Actions ilimitados.)
name: Recolector cada minuto
on:
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch:
concurrency:
  group: recolector-minuto
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  recolector:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ciclo.txt
      - run: pip install -q -r requirements-ciclo.txt
      - name: Capturar cada minuto durante 57 min
        env:
          AURIA_ORIGEN: github-min
        run: python -m auria.bucle --minutos 57 --intervalo 60 --subir-cada 2 --prevision-cada 15
