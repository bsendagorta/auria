name: Sonda DATEX II
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s -m 60 -o /tmp/d.xml https://nap.dgt.es/datex2/dt-gv/SituationPublication/all/content.xml
          python3 - <<'PY'
          import re, collections
          t=open('/tmp/d.xml',encoding='utf-8',errors='ignore').read()
          tags=collections.Counter(re.findall(r'<(?:\w+:)?(\w+)[ >]',t))
          recs=re.findall(r'<(?:\w+:)?situationRecord .*?</(?:\w+:)?situationRecord>',t,re.S)
          ej=[r for r in recs if 'Obstruction' in r[:400] or 'Accident' in r[:400]][:2]
          open('informes/datex_muestra.txt','w').write(f"bytes {len(t)} registros {len(recs)}\n"+"\n".join(f"{k} {v}" for k,v in tags.most_common(150))+"\n\n"+"\n\n".join(e[:6000] for e in ej))
          PY
          git config user.name auria-bot; git config user.email auria-bot@users.noreply.github.com
          git add informes/datex_muestra.txt && git commit -qm "sonda datex" && git pull -q --rebase && git push -q
