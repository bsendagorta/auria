# Cada 30 min: captura las salidas en directo y recalcula la predicción de las próximas 6 horas.
# (Repositorio privado + plan gratuito = 2.000 min/mes. Si el repo es público, puedes bajar a */10.)
name: Ciclo AURIA (captura + predicción)
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: datos-auria
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ciclo.txt
      - run: pip install -q -r requirements-ciclo.txt
      - name: Captura de salidas en directo
        env:
          AURIA_ORIGEN: github
        run: |
          python -m auria.recolector_online || echo "::warning::Fallo en la captura (queda registrado)"
      - name: Predicción próximas 6 horas
        run: python -m auria.prevision
      - name: Subir datos
        if: always()
        run: |
          scripts/subir_datos.sh "datos: ciclo $(date -u +%Y-%m-%dT%H:%MZ)"
