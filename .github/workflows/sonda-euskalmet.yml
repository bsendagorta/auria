name: Sonda Euskalmet
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests PyJWT cryptography pandas numpy
      - env:
          EUSKALMET_PRIVATE_KEY: ${{ secrets.EUSKALMET_PRIVATE_KEY }}
          EUSKALMET_FINGERPRINT: ${{ secrets.EUSKALMET_FINGERPRINT }}
        run: |
          python - <<'PY'
          import json, datetime, requests
          from auria import euskalmet as E
          import os, re
          raw=os.environ.get("EUSKALMET_PRIVATE_KEY","")
          L=[f"disponible: {E.disponible()} | secreto: {len(raw)} caracteres, cabeceras {re.findall(r'BEGIN [A-Z ]+', raw)}, saltos {raw.count(chr(10))} | huella {len(os.environ.get('EUSKALMET_FINGERPRINT','').strip())} caracteres"]
          import hashlib
          cu=re.sub(r"[^A-Za-z0-9+/=]","",E._pem(raw).split("-----")[2])
          L.append(f"cuerpo normalizado {len(cu)} sha {hashlib.sha256(cu.encode()).hexdigest()[:16]} | huella sha {hashlib.sha256(os.environ.get('EUSKALMET_FINGERPRINT','').strip().encode()).hexdigest()[:16]}")
          rutas=["/euskalmet/geo/regions","/euskalmet/geo/regions/basque_country","/euskalmet/geo/regions/basque_country/zones",
                 f"/euskalmet/alerts/zones/basque_country/forecast/at/{datetime.date.today():%Y/%m/%d}"]
          try:
              tok=E.token(600)
          except Exception as e:
              open("informes/euskalmet_sonda.txt","w").write("\n".join(L)+f"\nERROR token: {type(e).__name__}: {e}"); raise SystemExit(0)
          for r in rutas:
              try:
                  x=requests.get(E.BASE+r,headers={"Authorization":"Bearer "+tok},timeout=30)
                  L.append(f"== {r} -> {x.status_code}\n{x.text[:2500]}")
              except Exception as e:
                  L.append(f"== {r} -> ERR {e}")
          open("informes/euskalmet_sonda.txt","w").write("\n\n".join(L))
          PY
          git config user.name auria-bot; git config user.email auria-bot@users.noreply.github.com
          git add informes/euskalmet_sonda.txt && git commit -qm "sonda euskalmet"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
