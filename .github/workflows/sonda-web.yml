name: Sonda web salidas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import requests, re
          out=[]
          for ua in ["AURIA/0.2 (proyecto personal de prediccion de emergencias)"]:
              for url in ["https://www.bizkaia.eus/es/bomberas-bomberos-bizkaia","https://www.bizkaia.eus/eu/bizkaiko-suhiltzaileak"]:
                  try:
                      r=requests.get(url,timeout=30,headers={"User-Agent":ua})
                      t=r.text
                      i=t.find("desde 08:00")
                      out.append(f"== {url} {r.status_code} len={len(t)} final={r.url} hist={[h.status_code for h in r.history]} idx={i}\n{t[:600]}\n...\n{t[i-400:i+200] if i>0 else ''}")
                  except Exception as e:
                      out.append(f"== {url} ERR {e}")
          open("informes/sonda_web.txt","w").write("\n\n".join(out))
          PY
          git config user.name auria-bot; git config user.email auria-bot@users.noreply.github.com
          git add informes/sonda_web.txt && git commit -qm "sonda web" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done
