# Lee bizkaia.eus cada minuto y recalcula la predicción cada 15 min, sin interrupción.
# Cada ejecución captura durante 5 h 40 min (GitHub corta a las 6 h) y, al terminar, lanza la siguiente.
# La programación horaria es solo un respaldo: GitHub no garantiza las tareas programadas y de noche
# puede saltarse muchas. Si ya hay un tramo en marcha, el nuevo espera (concurrency) y no se solapan.
name: Recolector cada minuto
on:
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch:
concurrency:
  group: recolector-minuto
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  recolector:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ciclo.txt
      - run: pip install -q -r requirements-ciclo.txt
      - name: Capturar cada minuto (5 h 40 min) y predecir cada 15 min
        env:
          AURIA_ORIGEN: github-min
          # clave de Euskalmet: secretos del repositorio (Settings > Secrets and variables > Actions)
          EUSKALMET_PRIVATE_KEY: ${{ secrets.EUSKALMET_PRIVATE_KEY }}
          EUSKALMET_FINGERPRINT: ${{ secrets.EUSKALMET_FINGERPRINT }}
        run: python -m auria.bucle --minutos 340 --intervalo 60 --subir-cada 2 --prevision-cada 15
      - name: Encadenar el siguiente tramo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run recolector-minuto.yml --ref "${GITHUB_REF_NAME}"
